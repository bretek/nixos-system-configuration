name: NixOS build
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: "Install Nix"
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: "Build NixOS desktop config"
        run: ./cicd/nix-build.sh machines/desktop/desktop.nix

      - name: "Build NixOS laptop config"
        run: ./cicd/nix-build.sh machines/laptop/laptop.nix
